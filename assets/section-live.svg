<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-label="04 / LIVE Live Projects">
  <title>04 / LIVE Live Projects</title>
  <style>
    @font-face{font-family:'hc-display';src:url(data:font/ttf;base64,) format('truetype');}@font-face{font-family:'hc-mono';src:url(data:font/ttf;base64,) format('truetype');}
    
    .marquee { animation: marquee 32s linear infinite; }
    @keyframes marquee { to { transform: translateX(var(--shift)); } }
    .drop { animation: drop 0.9s cubic-bezier(.2,.9,.3,1.3) both; }
    @keyframes drop {
      0% { transform: translateY(-560px) rotate(-14deg); }
      100% { transform: none; }
    }
    .rise { animation: rise 0.8s cubic-bezier(.2,.9,.3,1.25) both; }
    @keyframes rise { from { transform: translateY(110px); } to { transform: none; } }
    .pop { animation: pop 0.45s cubic-bezier(.2,.9,.3,1.4) both; transform-box: fill-box; transform-origin: center; }
    @keyframes pop { from { transform: scale(0.4) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="1200" height="112" fill="#0d0d0d"/>
  <rect x="32" y="39.0" width="117.8" height="34" fill="#ffd93d"/>
  <text x="45" y="62.0" font-family="hc-mono" font-size="17" fill="#0d0d0d">04 / LIVE</text>
  <g clip-path="url(#title)">
    <text class="rise" x="173.8" y="76.9"
          font-family="hc-display" font-size="58" fill="#fffdf5">LIVE PROJECTS</text>
  </g>
  <defs><clipPath id="title"><rect x="0" y="10" width="1200" height="92"/></clipPath></defs>
  <rect x="1130" y="38.0" width="36" height="36" fill="#ffd93d" stroke="#fffdf5" stroke-width="3"/>
</svg>
