<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Let's talk systems.">
  <title>Let's talk systems.</title>
  <style>
    @font-face{font-family:'hc-display';src:url(data:font/ttf;base64,) format('truetype');}@font-face{font-family:'hc-mono';src:url(data:font/ttf;base64,) format('truetype');}
    
    .marquee { animation: marquee 32s linear infinite; }
    @keyframes marquee { to { transform: translateX(var(--shift)); } }
    .drop { animation: drop 0.9s cubic-bezier(.2,.9,.3,1.3) both; }
    @keyframes drop {
      0% { transform: translateY(-560px) rotate(-14deg); }
      100% { transform: none; }
    }
    .rise { animation: rise 0.8s cubic-bezier(.2,.9,.3,1.25) both; }
    @keyframes rise { from { transform: translateY(110px); } to { transform: none; } }
    .pop { animation: pop 0.45s cubic-bezier(.2,.9,.3,1.4) both; transform-box: fill-box; transform-origin: center; }
    @keyframes pop { from { transform: scale(0.4) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="1200" height="250" fill="#ff6fb5"/>
  <g clip-path="url(#talk)">
    <text class="rise" x="44" y="138" font-family="hc-display" font-size="76" fill="#0d0d0d">LET'S TALK</text>
  </g>
  <defs><clipPath id="talk"><rect x="0" y="40" width="1200" height="118"/></clipPath></defs>
  <g transform="rotate(-3 790.0 105)">
    <g class="drop" style="animation-delay:0.5s">
      <rect x="566.7" y="87.6" width="460.5" height="74.5" fill="#0d0d0d"/>
      <rect x="559.7" y="80.6" width="460.5" height="74.5" fill="#ffd93d" stroke="#0d0d0d" stroke-width="4"/>
      <text x="574.7" y="138" font-family="hc-display" font-size="76" fill="#0d0d0d">SYSTEMS.</text>
    </g>
  </g>
  
  <rect y="196" width="1200" height="54" fill="#0d0d0d"/>
  <g font-family="hc-mono" font-size="17" letter-spacing="1.2" fill="#fffdf5">
    <g class="marquee" style="--shift:-1820.8px;animation-direction:reverse">
      <text x="0.0" y="229.0">BACKEND</text><text x="95.6" y="229.0" fill="#ffd93d">◆</text><text x="122.8" y="229.0">INTEGRATIONS</text><text x="275.4" y="229.0" fill="#ffd93d">◆</text><text x="302.6" y="229.0">SQL</text><text x="352.6" y="229.0" fill="#ffd93d">◆</text><text x="379.8" y="229.0">PRODUCTION SUPPORT</text><text x="600.8" y="229.0" fill="#ffd93d">◆</text><text x="628.0" y="229.0">INTERNAL TOOLS</text><text x="803.4" y="229.0" fill="#ffd93d">◆</text><text x="830.6" y="229.0">PYTHON / DJANGO</text><text x="1017.4" y="229.0" fill="#ffd93d">◆</text><text x="1044.6" y="229.0">NESTJS</text><text x="1128.8" y="229.0" fill="#ffd93d">◆</text><text x="1156.0" y="229.0">LARAVEL</text><text x="1251.6" y="229.0" fill="#ffd93d">◆</text><text x="1278.8" y="229.0">JAVA / APACHE CAMEL</text><text x="1511.2" y="229.0" fill="#ffd93d">◆</text><text x="1538.4" y="229.0">REMOTE FROM TUNJA, CO</text><text x="1793.6" y="229.0" fill="#ffd93d">◆</text><text x="1820.8" y="229.0">BACKEND</text><text x="1916.4" y="229.0" fill="#ffd93d">◆</text><text x="1943.6" y="229.0">INTEGRATIONS</text><text x="2096.2" y="229.0" fill="#ffd93d">◆</text><text x="2123.4" y="229.0">SQL</text><text x="2173.4" y="229.0" fill="#ffd93d">◆</text><text x="2200.6" y="229.0">PRODUCTION SUPPORT</text><text x="2421.6" y="229.0" fill="#ffd93d">◆</text><text x="2448.8" y="229.0">INTERNAL TOOLS</text><text x="2624.2" y="229.0" fill="#ffd93d">◆</text><text x="2651.4" y="229.0">PYTHON / DJANGO</text><text x="2838.2" y="229.0" fill="#ffd93d">◆</text><text x="2865.4" y="229.0">NESTJS</text><text x="2949.6" y="229.0" fill="#ffd93d">◆</text><text x="2976.8" y="229.0">LARAVEL</text><text x="3072.4" y="229.0" fill="#ffd93d">◆</text><text x="3099.6" y="229.0">JAVA / APACHE CAMEL</text><text x="3332.0" y="229.0" fill="#ffd93d">◆</text><text x="3359.2" y="229.0">REMOTE FROM TUNJA, CO</text><text x="3614.4" y="229.0" fill="#ffd93d">◆</text>
    </g>
  </g>
  <rect x="1.5" y="1.5" width="1197" height="247" fill="none" stroke="#0d0d0d" stroke-width="3"/>
</svg>
